name: FPL Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 2' # Kjører automatisk hver tirsdag kl 04:00 UTC (etter en GW)
  workflow_dispatch: # Lar deg kjøre den manuelt fra GitHub-sidene

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Pipeline Execution (CI check)
      run: |
        # Kjører pipeline for å sjekke at alt funker mot FPL API
        python pipeline.py
      
    - name: Verify Database Exists
      run: |
        # Sjekker at SQLite-databasen faktisk ble generert
        if [ -f "fpl_data.db" ]; then
          echo "Database created successfully!"
        else
          echo "Database creation failed!"
          exit 1
        fi